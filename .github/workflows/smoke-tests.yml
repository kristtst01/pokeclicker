name: CI Pipeline

on:
  push:
    branches: [main, develop, feat/*, migrate/*]
  pull_request:
    branches: [main, develop]

jobs:
  quality-checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Check Prettier formatting
        run: |
          cd frontend && pnpm run format:check
          cd ../backend && pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Build project
        run: pnpm run build

      - name: Run frontend unit tests
        run: pnpm run test:run
        working-directory: ./frontend

      - name: Run backend unit tests
        run: pnpm run test:run
        working-directory: ./backend

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Find available port and start backend server
        run: |
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')
          echo "Using port: $PORT"
          echo "BACKEND_PORT=$PORT" >> $GITHUB_ENV

          cd backend
          PORT=$PORT pnpm run start &
          sleep 5
          curl --retry 10 --retry-delay 1 --retry-connrefused "http://localhost:$PORT/?query=%7Bhealth%7Bstatus%7D%7D"
        env:
          MONGODB_URI: mongodb://localhost:27017/pokeclicker_test
          JWT_SECRET: ci_secret_not_used_in_production

      - name: Create .env file for frontend
        run: |
          echo "VITE_GRAPHQL_URL=http://localhost:${{ env.BACKEND_PORT }}/" > frontend/.env.local

      # Smoke tests temporarily disabled due to CI environment issues with onboarding modal
      # TODO: Re-enable once onboarding modal blocking issue is resolved in CI
      # - name: Run smoke tests
      #   run: pnpm exec playwright test smoke.spec.ts --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
